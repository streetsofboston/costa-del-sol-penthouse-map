const fmt = n => n ? '€' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '—';
const map = L.map('map', {scrollWheelZoom: false, touchZoom: true, zoomSnap: 0.25}).setView([36.45, -5.05], 10);
// Trackpad pinch (ctrl+wheel) over the map: zoom the map, not the page.
// Plain wheel (no ctrl) is left alone so the page scrolls normally.
document.getElementById('map').addEventListener('wheel', function (e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  var pt = map.mouseEventToContainerPoint(e);
  map.setZoomAround(pt, map.getZoom() - e.deltaY * 0.005);
}, {passive: false});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom',
  maxZoom: 19
}).addTo(map);
const markers = L.layerGroup().addTo(map);

function badge(s) {
  return s == null ? '<span class="badge unscored">Unscored</span>' : `<span class="badge">★ ${s}</span>`;
}
function popupHtml(p) {
  const gmaps = `https://www.google.com/maps?q=${p.lat},${p.lon}`;
  const listing = p.listing_url ? `<a href="${p.listing_url}" target="_blank" rel="noopener">View listing ↗</a> · ` : '';
  return `<h4>${p.name}</h4>
    <div><b>${fmt(p.price)}</b> · ${p.beds||'—'} bd / ${p.baths||'—'} ba · ${p.size||'—'} m²</div>
    <div>${p.area||''} · ${p.town||''}</div>
    <div style="margin:4px 0">${badge(p.score)}</div>
    <div>${listing}<a href="${gmaps}" target="_blank" rel="noopener">Google Maps ↗</a></div>`;
}
function cardHtml(p) {
  const listing = p.listing_url ? `<a href="${p.listing_url}" target="_blank" rel="noopener">View listing ↗</a>` : '';
  return `<div class="card" data-id="${p.id}">
    <h3>${p.name}</h3>
    <div class="price">${fmt(p.price)}</div>
    <div class="meta">${p.beds||'—'} bd · ${p.baths||'—'} ba · ${p.size||'—'} m² built${p.terrace ? ' · ' + p.terrace + ' m² terrace' : ''}</div>
    <div class="meta">${p.area||''} · ${p.town||''}</div>
    <div class="meta">${badge(p.score)}</div>
    <div class="links">${listing}
    <a href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">Google Maps ↗</a></div>
  </div>`;
}
function filtered() {
  const q = document.getElementById('q').value.toLowerCase();
  const a = document.getElementById('area').value;
  const ms = document.getElementById('minscore').value;
  return PROPS.filter(p => {
    if (q && !((p.name||'')+' '+(p.area||'')+' '+(p.town||'')).toLowerCase().includes(q)) return false;
    if (a && p.area !== a) return false;
    if (ms && (p.score == null || p.score < +ms)) return false;
    return true;
  });
}
function render() {
  const list = filtered();
  markers.clearLayers();
  const bounds = [];
  list.forEach(p => {
    const m = L.circleMarker([p.lat, p.lon], {
      radius: 8, color: '#fff', weight: 2, fillColor: p.color, fillOpacity: .9
    }).bindPopup(popupHtml(p));
    markers.addLayer(m);
    bounds.push([p.lat, p.lon]);
  });
  if (bounds.length) map.fitBounds(bounds, {padding: [30, 30]});
  document.getElementById('list').innerHTML = list.map(cardHtml).join('');
  document.getElementById('count').textContent = `${list.length} of ${PROPS.length} properties`;
  document.getElementById('subtitle').textContent = `${PROPS.length} penthouses · Estepona & Costa del Sol · prices ${fmt(Math.min(...PROPS.map(p=>p.price).filter(Boolean)))}–${fmt(Math.max(...PROPS.map(p=>p.price)))}`;
}
['q','area','minscore'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
